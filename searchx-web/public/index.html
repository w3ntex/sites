<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SearchX" id="meta-app-title">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>SearchX</title>
  <link rel="manifest" href="manifest.webmanifest" id="link-manifest">
  <link rel="apple-touch-icon" href="icons/app-180.png" id="link-touch-icon">
  <link rel="icon" type="image/png" href="icons/app-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the discreet home-screen name/icon before Safari reads the page.
    (function () {
      try {
        var k = (JSON.parse(localStorage.getItem('sx.settings') || '{}') || {}).installIcon;
        var m = { calc: ['Calculatrice', 'calc'], notes: ['Notes', 'notes'], clock: ['Horloge', 'clock'] }[k];
        if (!m) return;
        document.getElementById('meta-app-title').setAttribute('content', m[0]);
        document.getElementById('link-touch-icon').setAttribute('href', 'icons/' + m[1] + '-180.png');
        document.getElementById('link-manifest').setAttribute('href', 'manifest-' + m[1] + '.webmanifest');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="boot"><img src="icons/app-180.png" alt="" width="72" height="72"></div>
  </div>
  <noscript><p style="color:#fff;padding:24px">SearchX a besoin de JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
