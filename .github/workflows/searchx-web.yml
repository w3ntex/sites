name: SearchX web

on:
  push:
    paths:
      - "searchx-web/**"
      - ".github/workflows/searchx-web.yml"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: searchx-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Check the Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Deploy to Cloudflare (only when secrets are configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets: skipping deploy (Cloudflare's Git integration deploys instead)."
            exit 0
          fi
          npx wrangler deploy
