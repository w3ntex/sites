<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge — JSON Prompt Transformer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --bg: #0c0d0f;
    --bg2: #13151a;
    --bg3: #1a1d24;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.13);
    --accent: #f5a623;
    --accent2: #ff6b35;
    --text: #e8e6e1;
    --muted: #6b6f7a;
    --muted2: #9a9da8;
    --green: #3dd68c;
    --blue: #5b8af5;
    --red: #f56565;
    --key: #c792ea;
    --str: #c3e88d;
    --num: #f78c6c;
    --bool: #89ddff;
  }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }
 
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
 
  /* Header */
  .header {
    margin-bottom: 48px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    color: #0c0d0f;
    flex-shrink: 0;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle {
    font-size: 14px;
    color: var(--muted2);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.5;
  }
 
  /* Main grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 680px) {
    .grid { grid-template-columns: 1fr; }
  }
 
  /* Panels */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .panel-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .dot-amber { background: var(--accent); }
  .dot-green { background: var(--green); }
  .dot-muted { background: var(--muted); }
 
  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    padding: 18px;
    resize: none;
    min-height: 280px;
    caret-color: var(--accent);
  }
  textarea::placeholder { color: var(--muted); }
 
  /* Output */
  .output-body {
    padding: 18px;
    min-height: 280px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
 
  .placeholder-state {
    color: var(--muted);
    font-style: italic;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
 
  /* Syntax highlight */
  .jkey   { color: var(--key); }
  .jstr   { color: var(--str); }
  .jnum   { color: var(--num); }
  .jbool  { color: var(--bool); }
  .jnull  { color: var(--muted2); }
  .jpunct { color: var(--muted2); }
 
  /* Controls row */
  .controls {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
 
  .btn-transform {
    flex: 1;
    min-width: 180px;
    padding: 14px 24px;
    background: var(--accent);
    color: #0c0d0f;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.01em;
  }
  .btn-transform:hover { opacity: 0.9; }
  .btn-transform:active { transform: scale(0.98); }
  .btn-transform:disabled { opacity: 0.5; cursor: not-allowed; }
 
  .btn-copy {
    padding: 14px 20px;
    background: transparent;
    color: var(--muted2);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-copy:hover { color: var(--text); border-color: var(--muted2); }
  .btn-copy.copied { color: var(--green); border-color: var(--green); }
 
  .btn-clear {
    padding: 14px 16px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-clear:hover { color: var(--red); border-color: var(--red); }
 
  /* Loading spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #0c0d0f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-transform.loading .spinner { display: block; }
  .btn-transform.loading .btn-text { display: none; }
 
  /* Status bar */
  .status {
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-height: 16px;
    transition: color 0.3s;
  }
  .status.error { color: var(--red); }
  .status.success { color: var(--green); }
 
  /* Options bar */
  .options {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .opt-label {
    font-size: 12px;
    color: var(--muted2);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .opt-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--muted2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--muted2); }
  .chip.active { background: var(--accent); color: #0c0d0f; border-color: var(--accent); font-weight: 600; }
 
  /* Footer */
  .footer-note {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
  }
  .footer-note a { color: var(--muted2); text-decoration: none; }
 
  /* Token count badge */
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--muted2);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">{}</div>
      <h1>Prompt<span>Forge</span></h1>
    </div>
    <p class="subtitle">// transform natural language prompts → structured JSON understood by AI models</p>
  </div>
 
  <div class="options">
    <span class="opt-label">Mode</span>
    <div class="opt-chips" id="modeChips">
      <button class="chip active" data-mode="standard">Standard</button>
      <button class="chip" data-mode="detailed">Detailed</button>
      <button class="chip" data-mode="chain-of-thought">Chain of Thought</button>
      <button class="chip" data-mode="few-shot">Few-Shot</button>
    </div>
  </div>
 
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label"><span class="dot dot-amber"></span>Raw Prompt</span>
        <span class="badge" id="charCount">0 chars</span>
      </div>
      <textarea id="inputPrompt" placeholder="Write your prompt here in natural language...
 
Example:
Summarize this article for a 10-year-old, focus on the main ideas, and keep it under 100 words. Be friendly and use simple vocabulary." spellcheck="false"></textarea>
    </div>
 
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label"><span class="dot dot-green"></span>JSON Output</span>
        <span class="badge" id="fieldCount"></span>
      </div>
      <div class="output-body" id="outputJson">
        <span class="placeholder-state">// transformed prompt will appear here</span>
      </div>
    </div>
  </div>
 
  <div class="controls">
    <button class="btn-transform" id="transformBtn" onclick="transform()">
      <span class="btn-text">⚡ Transform Prompt</span>
      <span class="spinner"></span>
    </button>
    <button class="btn-copy" id="copyBtn" onclick="copyOutput()">Copy JSON</button>
    <button class="btn-clear" onclick="clearAll()">Clear</button>
  </div>
 
  <div class="status" id="status"></div>
 
  <div class="footer-note">
    Powered by Claude · Structured prompts improve AI accuracy & reproducibility
  </div>
</div>
 
<script>
let currentMode = 'standard';
let lastJson = '';
 
const modePrompts = {
  'standard': `You are a prompt engineering expert. Convert the user's natural language prompt into a structured JSON object that an AI can precisely interpret.
 
The JSON should include relevant fields from this set (only include what's applicable):
- task: main task type (e.g. "summarize", "translate", "generate", "analyze", "classify", "extract")
- instruction: clear, imperative instruction rewritten for clarity
- context: any background info provided
- constraints: array of specific limitations, rules, or requirements
- output_format: description of expected output format
- tone: writing tone if specified
- audience: target audience if specified
- language: target language if different from English
- examples: array of examples if any were given
- persona: role/persona for the AI if implied
- priority: key focus areas ranked by importance
- metadata: any other useful structured fields
 
Return ONLY valid JSON. No explanation. No markdown. Just the raw JSON object.`,
 
  'detailed': `You are an expert prompt engineer. Transform the user's prompt into a highly detailed JSON structure suitable for advanced AI systems.
 
Include all applicable fields:
- task_type: primary task category
- sub_tasks: array of sub-tasks if the prompt is complex
- instruction: precise, imperative instruction
- context: all background information
- constraints: array of hard rules
- preferences: array of soft preferences
- output_format: { type, structure, length, style }
- tone: { formality, emotion, voice }
- audience: { demographic, knowledge_level, age_range }
- language: { source, target, dialect }
- content_requirements: specific content to include/exclude
- quality_criteria: what defines a good response
- persona: { role, expertise_level, personality }
- reasoning_style: how the AI should reason
- meta: { urgency, importance, domain }
 
Return ONLY valid JSON. No explanation, no markdown.`,
 
  'chain-of-thought': `You are a prompt engineering expert specializing in chain-of-thought prompting. Convert the user's prompt into a JSON structure that includes explicit reasoning steps.
 
Structure the JSON with:
- task: the main objective
- instruction: the core instruction
- thinking_steps: array of reasoning steps the AI should follow before answering
- context: background information
- constraints: rules and limitations
- output_format: expected output structure
- cot_trigger: the chain-of-thought trigger phrase to append
- verification_steps: steps to verify the answer quality
- audience: intended recipient
- tone: desired response tone
 
Return ONLY valid JSON. No explanation, no markdown.`,
 
  'few-shot': `You are a prompt engineering expert specializing in few-shot learning prompts. Convert the user's prompt into a JSON structure that includes example demonstrations.
 
Build the JSON with:
- task: the core task
- instruction: clear task instruction
- system_context: overall system context
- examples: array of 2-3 generated input/output example pairs that illustrate the task
- input_template: template for how inputs should be structured
- output_template: template for expected outputs
- constraints: rules to follow
- evaluation_criteria: what makes a good output
- edge_cases: potential tricky situations to handle
 
Return ONLY valid JSON. No explanation, no markdown.`
};
 
document.getElementById('inputPrompt').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length + ' chars';
});
 
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    currentMode = this.dataset.mode;
  });
});
 
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}
 
function syntaxHighlight(json) {
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
    let cls = 'jnum';
    if (/^"/.test(match)) {
      cls = /:$/.test(match) ? 'jkey' : 'jstr';
    } else if (/true|false/.test(match)) {
      cls = 'jbool';
    } else if (/null/.test(match)) {
      cls = 'jnull';
    }
    return '<span class="' + cls + '">' + match + '</span>';
  }).replace(/([{}\[\],:])/g, '<span class="jpunct">$1</span>');
}
 
async function transform() {
  const prompt = document.getElementById('inputPrompt').value.trim();
  if (!prompt) {
    setStatus('// please enter a prompt first', 'error');
    return;
  }
 
  const btn = document.getElementById('transformBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  setStatus('// transforming prompt...');
  document.getElementById('outputJson').innerHTML = '<span class="placeholder-state">// processing...</span>';
  document.getElementById('fieldCount').textContent = '';
 
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: modePrompts[currentMode],
        messages: [{ role: "user", content: prompt }]
      })
    });
 
    const data = await response.json();
 
    if (data.error) {
      throw new Error(data.error.message || 'API error');
    }
 
    let raw = data.content.map(b => b.text || '').join('');
    raw = raw.replace(/```json|```/g, '').trim();
 
    const parsed = JSON.parse(raw);
    lastJson = JSON.stringify(parsed, null, 2);
 
    const fieldCount = Object.keys(parsed).length;
    document.getElementById('fieldCount').textContent = fieldCount + ' fields';
 
    document.getElementById('outputJson').innerHTML = syntaxHighlight(lastJson);
    setStatus('// ✓ transformed successfully · ' + lastJson.length + ' bytes', 'success');
 
  } catch (err) {
    console.error(err);
    document.getElementById('outputJson').innerHTML = '<span class="placeholder-state">// error during transformation</span>';
    setStatus('// error: ' + (err.message || 'unexpected failure'), 'error');
    document.getElementById('fieldCount').textContent = '';
  }
 
  btn.disabled = false;
  btn.classList.remove('loading');
}
 
function copyOutput() {
  if (!lastJson) return;
  navigator.clipboard.writeText(lastJson).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy JSON';
      btn.classList.remove('copied');
    }, 1500);
  });
}
 
function clearAll() {
  document.getElementById('inputPrompt').value = '';
  document.getElementById('outputJson').innerHTML = '<span class="placeholder-state">// transformed prompt will appear here</span>';
  document.getElementById('charCount').textContent = '0 chars';
  document.getElementById('fieldCount').textContent = '';
  setStatus('');
  lastJson = '';
}
 
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') transform();
});
</script>
</body>
</html>
